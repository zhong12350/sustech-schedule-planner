# 南科大课名别名知识库
#
# 用法：
#   1. 运行  python scripts/export_tis_catalog.py  从教务系统导出本学期全校课名索引
#   2. 在 data/catalogs/*.yaml 里查到正式名称，把同学常打的简称填到下面 aliases
#   3. 匹配失败时查看 data/match_misses.log，把高频 miss 补进此文件
#
# 格式：aliases 的 key = 用户可能输入的简称/昵称/错别字
#       value = TIS 正式课名（与 catalog 里 identities 一致，不用带班号）

semester: ""  # 可选：标注适用学期，如 "2025-2026 第1学期"
notes: "手动维护的简称映射；全校完整课表见 data/catalogs/"

aliases:
  # --- 数学 / 物理 ---
  高数: 高等数学（下）
  高数下: 高等数学（下）
  高数上: 高等数学（上）
  线代: 线性代数
  概率论: 概率论与数理统计
  大物: 大学物理（下）
  大物下: 大学物理（下）
  大物上: 大学物理（上）

  # --- 信电 / CS 常见 ---
  信号: 信号与系统
  数信: 数字信号处理
  数逻: 数理逻辑导论
  计网: 计算机网络
  操统: 操作系统
  数据结构: 数据结构与算法

  # --- 通识 / 体育 ---
  体育5: 体育Ⅴ
  体育五: 体育Ⅴ
  体育4: 体育Ⅳ
  体育四: 体育Ⅳ
  毛概: 毛泽东思想和中国特色社会主义理论体系概论
  近代史: 中国近现代史纲要

  # --- 化学 / 英语 ---
  大化: 大学化学
  大学化学下: 大学化学（下）
  EAP: EAP-12班-英文
