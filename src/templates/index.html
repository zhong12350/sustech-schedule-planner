<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUSTech Schedule Planner</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
    header { text-align: center; margin-bottom: 2.5rem; }
    header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text); }
    label { display: block; font-size: 0.875rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .course-input-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .course-input-row input { margin-bottom: 0; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; min-height: 2rem; }
    .tag {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 0.3rem 0.75rem; font-size: 0.875rem;
    }
    .tag button {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1rem; line-height: 1; padding: 0;
    }
    .tag button:hover { color: var(--danger); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.65rem 1.25rem; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: white; width: 100%; padding: 0.85rem; font-size: 1rem; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { background: var(--border); color: var(--text); padding: 0.5rem 1rem; }
    .btn-sm:hover { background: #475569; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
    .checkbox-row input { width: auto; margin: 0; }
    .checkbox-row label { margin: 0; color: var(--text); }
    #results { display: none; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .result-header h2 { margin: 0; }
    .badge { background: var(--accent); color: white; border-radius: 20px; padding: 0.2rem 0.75rem; font-size: 0.875rem; }
    .schedule-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem;
      cursor: pointer; transition: border-color 0.15s;
    }
    .schedule-card:hover { border-color: var(--accent); }
    .schedule-card.expanded { border-color: var(--accent); }
    .schedule-header { display: flex; justify-content: space-between; align-items: center; }
    .schedule-rank { font-size: 1.25rem; font-weight: 700; color: var(--warning); }
    .schedule-score { font-size: 1.1rem; font-weight: 600; }
    .schedule-score span { color: var(--warning); }
    .schedule-meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .schedule-detail { display: none; margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .schedule-card.expanded .schedule-detail { display: block; }
    .course-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0.5rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem;
    }
    .course-item:last-child { border-bottom: none; }
    .course-name { font-weight: 600; }
    .course-teacher { color: var(--muted); font-size: 0.85rem; }
    .course-time { color: var(--muted); font-size: 0.8rem; text-align: right; }
    .rating { color: var(--warning); font-weight: 600; }
    .no-rating { color: var(--muted); }
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
    .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #450a0a; border: 1px solid var(--danger); color: #fca5a5; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .steps { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
    .step { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--muted); }
    .step-num {
      width: 24px; height: 24px; border-radius: 50%; background: var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;
    }
    .step.active .step-num { background: var(--accent); color: white; }
    .step.active { color: var(--text); }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
    footer a { color: var(--accent); text-decoration: none; }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; max-width: 560px; width: 100%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 0.75rem; }
    .modal p { color: var(--muted); font-size: 0.875rem; margin-bottom: 1rem; }
    .ambig-group { margin-bottom: 1.25rem; }
    .ambig-group label { color: var(--text); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .option-card {
      display: block; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem;
      cursor: pointer; transition: border-color 0.15s;
    }
    .option-card:hover, .option-card.selected { border-color: var(--accent); }
    .option-card input { margin-right: 0.5rem; }
    .option-title { font-weight: 600; }
    .option-meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }
    .warning {
      background: #422006; border: 1px solid var(--warning); color: #fde68a;
      border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SUSTech Schedule Planner</h1>
      <p>南科大智能课表规划 · 无冲突求解 · NCES 口碑排序</p>
    </header>

    <div class="steps">
      <div class="step active"><span class="step-num">1</span> 登录</div>
      <div class="step active"><span class="step-num">2</span> 添加课程</div>
      <div class="step active"><span class="step-num">3</span> 查看方案</div>
    </div>

    <div id="form-section">
      <div class="card">
        <h2>登录 TIS</h2>
        <div class="row">
          <div>
            <label for="student_id">学号</label>
            <input type="text" id="student_id" placeholder="如 12345678" autocomplete="username">
          </div>
          <div>
            <label for="password">CAS 密码</label>
            <input type="password" id="password" placeholder="你的 CAS 密码" autocomplete="current-password">
          </div>
        </div>
        <p style="color:var(--muted);font-size:0.8rem;margin-top:-0.5rem">
          密码仅用于登录 TIS 获取课程数据，不会存储或上传
        </p>
      </div>

      <div class="card">
        <h2>添加课程</h2>
        <div class="course-input-row">
          <input type="text" id="course_input" placeholder="输入课程名，如 高等数学（下）">
          <button class="btn btn-sm" onclick="addCourse()">添加</button>
        </div>
        <div class="tags" id="course_tags"></div>
        <p style="color:var(--muted);font-size:0.8rem;margin-top:0.5rem">
          课程名需与 TIS 系统中一致，不需要带班号
        </p>
      </div>

      <div class="card">
        <div class="checkbox-row">
          <input type="checkbox" id="use_ratings" checked>
          <label for="use_ratings">从牛娃课程评价社区 (NCES) 获取评分并排序</label>
        </div>
        <button class="btn btn-primary" id="solve_btn" onclick="solve()">开始求解</button>
      </div>
    </div>

    <div id="error-box" class="error" style="display:none"></div>
    <div id="warning-box" class="warning" style="display:none"></div>
    <div id="loading" class="loading" style="display:none">
      <div class="spinner"></div>
      <div>正在登录 TIS、获取课程数据并求解，请稍候…</div>
    </div>

    <div id="results">
      <div class="result-header">
        <h2>求解结果 <span class="badge" id="result_count"></span></h2>
        <button class="btn btn-sm" onclick="resetForm()">重新求解</button>
      </div>
      <p style="color:var(--muted);font-size:0.875rem;margin-bottom:1rem" id="semester_info"></p>
      <div id="schedule_list"></div>
    </div>

    <footer>
      评分数据来自 <a href="https://nces.cra.moe/" target="_blank">牛娃课程评价社区 (NCES)</a>
      · 仅供学习研究使用
    </footer>
  </div>

  <div id="disambig-modal" class="modal-overlay">
    <div class="modal">
      <h3>请选择具体课程</h3>
      <p>以下输入匹配到了多个不同课程（可能来自不同院系），请确认你要选的是哪一个：</p>
      <div id="ambig-content"></div>
      <button class="btn btn-primary" style="margin-top:0.5rem" onclick="confirmDisambig()">确认并继续求解</button>
    </div>
  </div>

  <script>
    const WEEKDAYS = ['周一','周二','周三','周四','周五'];
    let courses = [];
    let pendingSessionId = null;
    let pendingAmbiguous = [];
    let pendingResolutions = {};

    function addCourse() {
      const input = document.getElementById('course_input');
      const name = input.value.trim();
      if (!name) return;
      if (courses.includes(name)) { input.value = ''; return; }
      courses.push(name);
      input.value = '';
      renderTags();
    }

    document.getElementById('course_input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addCourse();
    });

    function removeCourse(name) {
      courses = courses.filter(c => c !== name);
      renderTags();
    }

    function renderTags() {
      const el = document.getElementById('course_tags');
      el.innerHTML = '';
      courses.forEach(c => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.appendChild(document.createTextNode(c));
        const btn = document.createElement('button');
        btn.textContent = '×';
        btn.onclick = () => removeCourse(c);
        tag.appendChild(btn);
        el.appendChild(tag);
      });
    }

    function showWarning(msg) {
      const box = document.getElementById('warning-box');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideWarning() {
      document.getElementById('warning-box').style.display = 'none';
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-box').style.display = 'none';
    }

    function formatTime(slots) {
      if (!slots || !slots.length) return '时间未知';
      return slots.map(s =>
        `${WEEKDAYS[s.weekday]||'?'} 第${s.start}-${s.end}节`
      ).join('、');
    }

    async function solve(resolutions = null) {
      hideError();
      hideWarning();
      const student_id = document.getElementById('student_id').value.trim();
      const password = document.getElementById('password').value;
      const use_ratings = document.getElementById('use_ratings').checked;

      if (!resolutions) {
        if (!student_id || !password) { showError('请填写学号和密码'); return; }
        if (!courses.length) { showError('请至少添加一门课程'); return; }
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      document.getElementById('solve_btn').disabled = true;

      const body = { courses, use_ratings };
      if (resolutions) {
        body.resolutions = resolutions;
        body.session_id = pendingSessionId;
      } else {
        body.student_id = student_id;
        body.password = password;
      }

      try {
        const resp = await fetch('/api/solve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await resp.json();

        if (data.needs_disambiguation) {
          pendingSessionId = data.session_id;
          pendingAmbiguous = data.ambiguous;
          pendingResolutions = {};
          showDisambigModal(data);
          return;
        }

        if (!data.ok) { showError(data.error || '求解失败'); return; }
        renderResults(data);
      } catch (e) {
        showError('网络错误: ' + e.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('solve_btn').disabled = false;
      }
    }

    function showDisambigModal(data) {
      const content = document.getElementById('ambig-content');
      content.innerHTML = '';
      pendingResolutions = {};

      data.ambiguous.forEach(group => {
        const div = document.createElement('div');
        div.className = 'ambig-group';
        const label = document.createElement('label');
        label.textContent = `「${group.query}」对应：`;
        div.appendChild(label);

        group.options.forEach((opt, i) => {
          const card = document.createElement('label');
          card.className = 'option-card' + (i === 0 ? ' selected' : '');
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = 'ambig-' + group.query;
          input.value = opt.identity;
          input.checked = i === 0;
          input.onchange = () => {
            pendingResolutions[group.query] = opt.identity;
            div.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
          };
          card.appendChild(input);
          const title = document.createElement('div');
          title.className = 'option-title';
          title.textContent = opt.identity;
          card.appendChild(title);
          const meta = document.createElement('div');
          meta.className = 'option-meta';
          const teachers = opt.teachers.length ? opt.teachers.join('、') : '教师未知';
          meta.textContent = `${opt.section_count} 个教学班 · 相似度 ${Math.round(opt.score * 100)}% · ${teachers}`;
          card.appendChild(meta);
          div.appendChild(card);
          if (i === 0) pendingResolutions[group.query] = opt.identity;
        });
        content.appendChild(div);
      });

      if (data.not_found && data.not_found.length) {
        showWarning('以下课程未找到，将不参与求解：' + data.not_found.join('、'));
      }

      document.getElementById('disambig-modal').classList.add('show');
    }

    function confirmDisambig() {
      document.getElementById('disambig-modal').classList.remove('show');
      solve(pendingResolutions);
    }

    function renderResults(data) {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      document.getElementById('result_count').textContent = data.total + ' 种方案';

      let info = (data.semester ? data.semester + ' · ' : '');
      if (data.matched_count != null && data.requested_count != null
          && data.matched_count < data.requested_count) {
        info += `已匹配 ${data.matched_count}/${data.requested_count} 门课 · `;
      }
      info += (data.message || '已按 NCES 评分总和从高到低排序，点击方案查看详情');
      document.getElementById('semester_info').textContent = info;

      if (data.warnings && data.warnings.length) {
        showWarning(data.warnings.join('；'));
      }
      if (data.not_found && data.not_found.length) {
        showWarning('未找到：' + data.not_found.join('、'));
      }

      const list = document.getElementById('schedule_list');
      if (!data.schedules || !data.schedules.length) {
        list.innerHTML = '<p style="color:var(--muted)">没有找到可行方案</p>';
        return;
      }

      list.innerHTML = data.schedules.map((sch, i) => {
        const rank = i + 1;
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
        const coursesHtml = sch.courses.map(c => `
          <div class="course-item">
            <div>
              <div class="course-name">${c.name}</div>
              <div class="course-teacher">${c.teacher || '教师未知'}</div>
            </div>
            <div class="course-time">
              ${c.rating != null
                ? `<span class="rating">★ ${c.rating.toFixed(1)}</span>`
                : '<span class="no-rating">无评分</span>'}
              <div>${formatTime(c.time_slots)}</div>
            </div>
          </div>
        `).join('');

        return `
          <div class="schedule-card" onclick="toggleCard(this)">
            <div class="schedule-header">
              <div>
                <span class="schedule-rank">${medal}</span>
                <span class="schedule-meta">${sch.rated_count}/${sch.total_count} 门有 NCES 评分</span>
              </div>
              <div class="schedule-score">总分 <span>${sch.score.toFixed(1)}</span></div>
            </div>
            <div class="schedule-detail">${coursesHtml}</div>
          </div>
        `;
      }).join('');
    }

    function toggleCard(el) {
      el.classList.toggle('expanded');
    }

    function resetForm() {
      document.getElementById('form-section').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      hideError();
      hideWarning();
      pendingSessionId = null;
    }
  </script>
</body>
</html>
